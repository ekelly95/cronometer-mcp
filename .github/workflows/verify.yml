# Typecheck and the full test suite on the three platforms the package claims.
# Nothing here has Cronometer credentials, by design: every test is offline and
# uses synthetic fixtures. Live behaviour is checked by hand before a release
# (docs/RELEASING.md).
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commits; the comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # pretest builds first, so this also proves the package compiles.
      - name: Tests
        run: npm test

      - name: The published package contains what it should
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = Object.values(JSON.parse(require('fs').readFileSync('pack.json','utf8')))[0].files.map(f => f.path);
            for (const needed of ['dist/cli/main.js', 'dist/mcp/server.js', 'README.md', 'LICENSE']) {
              if (!files.includes(needed)) { console.error('missing from package:', needed); process.exit(1); }
            }
            const stray = files.filter(f => /^(test|src|docs)\//.test(f) || f.endsWith('.map'));
            if (stray.length) { console.error('should not be packaged:', stray); process.exit(1); }
            console.log(files.length + ' files, all expected.');
          "
